name: Deploy Search-Application+searchdl

on:
  push:
    branches:
      - test

  workflow_dispatch: # Allows manual runs
    inputs:
      branch:
        description: "Which Branch to trigger in searchdl (e.g., main)"
        required: true
        default: "main"

jobs:
  deploy-to-dev-inttest01:
    name: Deploy Search-Application to DEV
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    uses: Street/workflows/.github/workflows/pbk-nextjs-container.yml@main # Reference to the reusable workflow
    secrets: inherit
    concurrency: Development-inttest01 # Match environment-name below for deployments
    with:
      environment-name: Development-inttest01
      operation: deploy
      environment-type: DEV
      instance-name: inttest01

  trigger-searchdl:
    name: Trigger Deployment for SearchDL
    needs: deploy-to-dev-inttest01
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SearchDL Deployment via GitHub API (curl)
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.INTTEST01_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Street/searchdl/actions/workflows/deploy-to-dev-inttest01.yml/dispatches \
            -d "{
              \"ref\": \"refs/heads/${{ github.event.inputs.branch }}\",
              \"inputs\": {
                \"environment-name\": \"Development-inttest01\",
                \"operation\": \"deploy\",
                \"environment-type\": \"DEV\",
                \"instance-name\": \"inttest01\"
              }
            }"
